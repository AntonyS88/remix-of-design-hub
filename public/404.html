<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const segmentsToKeep = 1;
      const currentLocation = window.location;
      const basePath = currentLocation.pathname
        .split("/")
        .slice(0, segmentsToKeep + 1)
        .join("/");
      const route = currentLocation.pathname
        .slice(1)
        .split("/")
        .slice(segmentsToKeep)
        .join("/")
        .replace(/&/g, "~and~");
      const query = currentLocation.search
        ? `&${currentLocation.search.slice(1).replace(/&/g, "~and~")}`
        : "";

      currentLocation.replace(
        `${currentLocation.protocol}//${currentLocation.host}${basePath}/?/${route}${query}${currentLocation.hash}`,
      );
    </script>
  </head>
  <body></body>
</html>
