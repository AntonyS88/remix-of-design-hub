<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const segmentsToKeep = 1;
      const location = window.location;
      const basePath = location.pathname
        .split("/")
        .slice(0, segmentsToKeep + 1)
        .join("/");
      const route = location.pathname
        .slice(1)
        .split("/")
        .slice(segmentsToKeep)
        .join("/")
        .replace(/&/g, "~and~");
      const query = location.search
        ? `&${location.search.slice(1).replace(/&/g, "~and~")}`
        : "";

      location.replace(
        `${location.protocol}//${location.host}${basePath}/?/${route}${query}${location.hash}`,
      );
    </script>
  </head>
  <body></body>
</html>
