<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const { pathname, search, hash } = window.location;
        if (!search.startsWith("?/")) return;

        const [route, ...queryParts] = search.slice(2).split("&");
        const decodeAmpersands = (value) => value.replace(/~and~/g, "&");
        const query = queryParts.length
          ? `?${decodeAmpersands(queryParts.join("&"))}`
          : "";

        window.history.replaceState(
          null,
          "",
          `${pathname}${decodeAmpersands(route)}${query}${hash}`,
        );
      })();
    </script>
    <title>Anton Sechin — Product Designer · AI Product Builder</title>
    <meta name="description" content="Product Designer and AI Product Builder working from problem framing and UX flows to design systems, working prototypes and product validation." />

    <meta property="og:type" content="website" />
